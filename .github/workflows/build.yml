name: Build VideoProps 1.12.2
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Reconstruct and verify source
        shell: bash
        run: |
          set -euo pipefail
          {
            cat ci/text.b64.00 ci/text.b64.01 ci/text.b64.02
            cat ci/rr03.{00..13}
            cat ci/p04.00 ci/p04.01fix.00 ci/p04.01fix.01 ci/p04.01fix.02 ci/rr401x03
            cat ci/rr402.{00..03} ci/rr403.{00..03}
            cat ci/rr500.{00..03} ci/rr501.{00..03}
            cat ci/p05.02 ci/p05.03
          } | tr -d '[:space:]' | base64 --ignore-garbage -d > /tmp/VideoProps-textonly.zip
          echo '36507019c0f0d350788ef522823df0828a49826387c4eeeade4da7eab73d907b  /tmp/VideoProps-textonly.zip' | sha256sum -c -
          unzip -q /tmp/VideoProps-textonly.zip
          find VideoPropsProject/src/main/java -name '*.java' -print0 | xargs -0 sed -i 's/setUnlocalizedName(/setTranslationKey(/g; s/EnumFacing\.getHorizontal(/EnumFacing.byHorizontalIndex(/g; s/getTabIconItem()/createIcon()/g'
          python3 ci/generate_textures.py VideoPropsProject/src/main/resources/assets/videoprops/textures
          test "$(find VideoPropsProject/src/main/resources/assets/videoprops/textures -name '*.png' | wc -l)" -eq 28
      - name: Build with ForgeGradle
        shell: bash
        working-directory: VideoPropsProject
        run: |
          set -o pipefail
          chmod +x gradlew
          java -version
          ./gradlew clean build --stacktrace --no-daemon 2>&1 | tee ../build.log
          grep -q 'BUILD SUCCESSFUL' ../build.log
          test -f build/libs/VideoProps-1.12.2-1.0.0.jar
          unzip -t build/libs/VideoProps-1.12.2-1.0.0.jar >/dev/null
          unzip -l build/libs/VideoProps-1.12.2-1.0.0.jar | grep -q 'assets/videoprops/lang/en_us.lang'
          unzip -l build/libs/VideoProps-1.12.2-1.0.0.jar | grep -q 'assets/videoprops/lang/ru_ru.lang'
          unzip -l build/libs/VideoProps-1.12.2-1.0.0.jar | grep -q 'com/crystal/videoprops/VideoProps.class'
      - name: Launch final JAR in clean Forge client
        shell: bash
        working-directory: VideoPropsProject
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb x11-xserver-utils mesa-utils libgl1-mesa-dri >/dev/null
          JAR="$PWD/build/libs/VideoProps-1.12.2-1.0.0.jar"
          test -f "$JAR"
          rm -rf run ../client-source-backup ../client-latest.log ../crash-reports
          mkdir -p run/mods ../client-source-backup
          cp "$JAR" run/mods/
          mv src/main ../client-source-backup/main
          mkdir -p src/main/java src/main/resources
          rm -rf build/classes build/resources build/sources
          collect_logs() {
            [ -f run/logs/latest.log ] && cp run/logs/latest.log ../client-latest.log || true
            if [ -d run/crash-reports ]; then
              mkdir -p ../crash-reports
              cp -a run/crash-reports/. ../crash-reports/ || true
            fi
          }
          restore_source() {
            collect_logs
            pkill -f 'net.minecraft.launchwrapper.Launch' >/dev/null 2>&1 || true
            rm -rf src/main
            [ -d ../client-source-backup/main ] && mv ../client-source-backup/main src/main || true
            rm -rf ../client-source-backup
          }
          trap restore_source EXIT
          XVFB_ARGS='-screen 0 1280x720x24 -ac +extension GLX +render -noreset'
          xvfb-run -a -s "$XVFB_ARGS" sh -c 'echo "DISPLAY=$DISPLAY"; xrandr -q; glxinfo -B' > ../xvfb-check.log 2>&1
          set +e
          xvfb-run -a -s "$XVFB_ARGS" ./gradlew runClient --stacktrace --no-daemon > ../client-launch.log 2>&1 &
          CLIENT_PID=$!
          set -e
          READY=0
          for i in $(seq 1 240); do
            if [ -f run/logs/latest.log ] && grep -q 'Forge Mod Loader has successfully loaded 5 mods' run/logs/latest.log && grep -q 'FMLFileResourcePack:Video Props' run/logs/latest.log && grep -q 'SoundSystem started' run/logs/latest.log; then
              READY=1
              break
            fi
            if ! kill -0 "$CLIENT_PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          collect_logs
          if [ "$READY" -ne 1 ]; then
            echo 'Minecraft client did not reach verified loaded state.'
            cat ../xvfb-check.log || true
            [ -f ../client-latest.log ] && tail -n 400 ../client-latest.log || true
            find ../crash-reports -type f -maxdepth 1 -print -exec tail -n 300 {} \; 2>/dev/null || true
            tail -n 300 ../client-launch.log || true
            exit 1
          fi
          sleep 8
          collect_logs
          grep -q 'Forge Mod Loader has identified 5 mods to load' ../client-latest.log
          grep -q 'FMLFileResourcePack:Video Props' ../client-latest.log
          grep -q 'Forge Mod Loader has successfully loaded 5 mods' ../client-latest.log
          if grep -Ei '\[(Client thread|main)/(ERROR|FATAL)\].*(videoprops|Video Props)|missing texture.*(videoprops|Video Props)|unable to load model.*(videoprops|Video Props)|LoaderExceptionModCrash.*videoprops|Caught exception from Video Props' ../client-latest.log; then
            echo 'VideoProps client error detected.'
            exit 1
          fi
          if find ../crash-reports -type f -maxdepth 1 2>/dev/null | grep -q .; then
            echo 'Crash report created during client verification.'
            exit 1
          fi
          echo 'FINAL JAR CLIENT LAUNCH SUCCESSFUL'
      - name: Launch final JAR in clean Forge dedicated server
        shell: bash
        working-directory: VideoPropsProject
        run: |
          set -euo pipefail
          JAR="$PWD/build/libs/VideoProps-1.12.2-1.0.0.jar"
          rm -rf run ../server-source-backup ../server-latest.log ../server-crash-reports
          mkdir -p run/mods ../server-source-backup
          cp "$JAR" run/mods/
          echo 'eula=true' > run/eula.txt
          printf 'online-mode=false\nlevel-name=vp-ci-world\nserver-port=25566\nmax-tick-time=-1\n' > run/server.properties
          mv src/main ../server-source-backup/main
          mkdir -p src/main/java src/main/resources
          rm -rf build/classes build/resources build/sources
          collect_server_logs() {
            [ -f run/logs/latest.log ] && cp run/logs/latest.log ../server-latest.log || true
            if [ -d run/crash-reports ]; then
              mkdir -p ../server-crash-reports
              cp -a run/crash-reports/. ../server-crash-reports/ || true
            fi
          }
          restore_source() {
            collect_server_logs
            pkill -f 'net.minecraft.launchwrapper.Launch' >/dev/null 2>&1 || true
            rm -rf src/main
            [ -d ../server-source-backup/main ] && mv ../server-source-backup/main src/main || true
            rm -rf ../server-source-backup
          }
          trap restore_source EXIT
          set +e
          ./gradlew runServer --stacktrace --no-daemon > ../server-launch.log 2>&1 &
          SERVER_PID=$!
          set -e
          READY=0
          for i in $(seq 1 240); do
            if [ -f run/logs/latest.log ] && grep -q 'Forge Mod Loader has successfully loaded 5 mods' run/logs/latest.log && grep -q 'Done (' run/logs/latest.log; then
              READY=1
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          collect_server_logs
          if [ "$READY" -ne 1 ]; then
            echo 'Dedicated server did not reach ready state.'
            [ -f ../server-latest.log ] && tail -n 400 ../server-latest.log || true
            find ../server-crash-reports -type f -maxdepth 1 -print -exec tail -n 300 {} \; 2>/dev/null || true
            tail -n 300 ../server-launch.log || true
            exit 1
          fi
          grep -Eiq 'videoprops|Video Props' ../server-latest.log
          if grep -Ei '\[(Server thread|main)/(ERROR|FATAL)\].*(videoprops|Video Props)|LoaderExceptionModCrash.*videoprops|Caught exception from Video Props' ../server-latest.log; then
            echo 'VideoProps server error detected.'
            exit 1
          fi
          if find ../server-crash-reports -type f -maxdepth 1 2>/dev/null | grep -q .; then
            echo 'Crash report created during server verification.'
            exit 1
          fi
          echo 'FINAL JAR DEDICATED SERVER LAUNCH SUCCESSFUL'
      - name: Package verified outputs
        if: success()
        shell: bash
        run: |
          mkdir -p dist
          cp VideoPropsProject/build/libs/VideoProps-1.12.2-1.0.0.jar dist/
          cp build.log dist/BUILD_LOG.txt
          cp client-launch.log dist/CLIENT_LAUNCH.txt
          cp client-latest.log dist/CLIENT_LATEST.log
          cp server-launch.log dist/SERVER_LAUNCH.txt
          cp server-latest.log dist/SERVER_LATEST.log
          cp xvfb-check.log dist/XVFB_CHECK.txt
          cp VideoPropsProject/README.txt dist/README.txt
          rm -rf VideoPropsProject/.gradle VideoPropsProject/build VideoPropsProject/run
          zip -qr dist/VideoProps-1.12.2-1.0.0-src.zip VideoPropsProject
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VideoProps-build
          path: |
            dist/*
            build.log
            client-launch.log
            client-latest.log
            server-launch.log
            server-latest.log
            xvfb-check.log
            crash-reports/*
            server-crash-reports/*
          if-no-files-found: warn
# corrected client error filter + dedicated-server final-jar check
